<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keamanan PDF Twofish & Blockchain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .log-box {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            height: 150px;
            overflow-y: scroll;
            padding: 10px;
            font-size: 0.85em;
            border-radius: 5px;
        }

        .hash-text {
            font-family: monospace;
            font-size: 0.9em;
            color: #d63384;
            word-break: break-all;
        }

        .tx-text {
            font-family: monospace;
            font-size: 0.9em;
            color: #0d6efd;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <h2 class="text-center mb-4">🛡️ Panel Pengamanan Dokumen Skripsi</h2>

        <div class="progress mb-4 d-none" id="progress-container" style="height: 25px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" id="progress-bar"
                role="progressbar" style="width: 0%; font-weight: bold;">0%</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white fw-bold">1. Proses Enkripsi (Twofish)</div>
                    <div class="card-body">
                        <form id="form-enkripsi">
                            <div class="mb-3">
                                <label class="form-label">Pilih File PDF</label>
                                <input type="file" class="form-control" id="file_pdf" accept=".pdf" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Kata Sandi (Kunci Rahasia)</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btn-enkripsi">Jalankan
                                Enkripsi</button>
                        </form>
                        <hr>
                        <label class="form-label fw-bold small">Log Proses Enkripsi:</label>
                        <div id="log-enkripsi" class="log-box">Sistem siap...<br></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-success text-white fw-bold">2. Penyimpanan Blockchain (Ganache)</div>
                    <div class="card-body d-flex flex-column">
                        <div class="alert alert-warning small" id="alert-blockchain">
                            Selesaikan proses enkripsi terlebih dahulu.
                        </div>
                        <button class="btn btn-success w-100 mb-3" id="btn-blockchain" disabled>Simpan Hash ke
                            Blockchain</button>

                        <label class="form-label fw-bold small">Log Proses Blockchain:</label>
                        <div id="log-blockchain" class="log-box mb-3">Menunggu data hash...<br></div>

                        <button class="btn btn-outline-danger w-100 mt-auto d-none" id="btn-reset">🔄 Selesai & Segarkan
                            Panel</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 mb-5">
                    <div class="card-header bg-dark text-white fw-bold">3. Riwayat Sistem & Transaksi</div>
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Nama File Terenkripsi</th>
                                    <th>Hash (SHA-256)</th>
                                    <th>TxHash (Blockchain)</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-riwayat">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let dataDokumen = { filename: "", encrypted_filename: "", hash: "" };

        function addLog(elementId, message) {
            const logBox = document.getElementById(elementId);
            logBox.innerHTML += `> ${message}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Fungsi mengatur Loading Bar
        function setProgress(percent, text, colorClass) {
            const pContainer = document.getElementById('progress-container');
            const pBar = document.getElementById('progress-bar');
            pContainer.classList.remove('d-none');
            pBar.className = `progress-bar progress-bar-striped progress-bar-animated ${colorClass}`;
            pBar.style.width = percent + '%';
            pBar.innerText = text;
        }

        async function muatRiwayat() {
            const response = await fetch('/api/riwayat');
            const data = await response.json();
            const tbody = document.getElementById('tabel-riwayat');
            tbody.innerHTML = "";
            data.riwayat.forEach((item, index) => {
                // Memotong string hash panjang agar tabel rapi, gunakan hover/tooltip untuk melihat utuh
                const shortHash = item.hash.substring(0, 15) + "...";
                const shortTx = item.txhash.substring(0, 15) + "...";

                tbody.innerHTML += `<tr>
                <td>${index + 1}</td>
                <td class="fw-bold">${item.filename}</td>
                <td class="hash-text" title="${item.hash}">${shortHash}</td>
                <td class="tx-text" title="${item.txhash}">${shortTx}</td>
                <td><span class="badge bg-success">Terkunci (Web3)</span></td>
            </tr>`;
            });
        }

        // 1. Eksekusi Enkripsi
        document.getElementById('form-enkripsi').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('btn-enkripsi');

            // Mulai Loading
            btn.disabled = true;
            document.getElementById('log-enkripsi').innerHTML = ""; // Bersihkan log
            setProgress(30, "Mengenkirpsi dengan Twofish...", "bg-primary");
            addLog("log-enkripsi", "Memulai inisialisasi Jaringan Feistel...");

            const formData = new FormData();
            formData.append("file_pdf", document.getElementById('file_pdf').files[0]);
            formData.append("password", document.getElementById('password').value);

            try {
                const response = await fetch('/api/enkripsi', { method: 'POST', body: formData });
                const result = await response.json();

                if (result.status === "success") {
                    setProgress(50, "Enkripsi Selesai! Menunggu Blockchain...", "bg-info");
                    addLog("log-enkripsi", `ENKRIPSI SUKSES! Waktu: ${result.waktu} detik`);
                    addLog("log-enkripsi", `Mengekstrak Hash SHA-256: ${result.hash.substring(0, 20)}...`);

                    dataDokumen.filename = result.filename;
                    dataDokumen.encrypted_filename = result.encrypted_filename;
                    dataDokumen.hash = result.hash;

                    document.getElementById('alert-blockchain').classList.add('d-none');
                    document.getElementById('btn-blockchain').disabled = false;
                    document.getElementById('log-blockchain').innerHTML = ""; // Bersihkan log BC
                    addLog("log-blockchain", `Hash siap: ${result.hash.substring(0, 15)}...`);
                } else {
                    setProgress(100, "Gagal Enkripsi!", "bg-danger");
                    addLog("log-enkripsi", `ERROR: ${result.error}`);
                    btn.disabled = false;
                }
            } catch (error) {
                setProgress(100, "Sistem Error!", "bg-danger");
                addLog("log-enkripsi", `SYSTEM ERROR: ${error}`);
                btn.disabled = false;
            }
        });

        // 2. Eksekusi Blockchain
        document.getElementById('btn-blockchain').addEventListener('click', async function () {
            const btn = document.getElementById('btn-blockchain');

            // Lanjut Loading
            btn.disabled = true;
            setProgress(80, "Berkomunikasi dengan Smart Contract...", "bg-warning");
            addLog("log-blockchain", "Menghubungi Ganache...");

            try {
                const response = await fetch('/api/blockchain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataDokumen)
                });
                const result = await response.json();

                if (result.status === "success") {
                    setProgress(100, "Semua Proses Selesai!", "bg-success");
                    addLog("log-blockchain", `TRANSAKSI SUKSES! Waktu: ${result.waktu} detik`);
                    addLog("log-blockchain", `TxHash: ${result.txhash}`);

                    // Refresh Tabel Riwayat
                    muatRiwayat();

                    // Munculkan tombol reset
                    document.getElementById('btn-reset').classList.remove('d-none');
                } else {
                    setProgress(100, "Gagal Blockchain!", "bg-danger");
                    addLog("log-blockchain", `ERROR: ${result.error}`);
                    btn.disabled = false;
                }
            } catch (error) {
                setProgress(100, "Sistem Error!", "bg-danger");
                addLog("log-blockchain", `SYSTEM ERROR: ${error}`);
                btn.disabled = false;
            }
        });

        // 3. Reset Log & Form agar Fresh Kembali
        document.getElementById('btn-reset').addEventListener('click', function () {
            // Kembalikan form dan tombol ke keadaan awal
            document.getElementById('form-enkripsi').reset();
            document.getElementById('btn-enkripsi').disabled = false;

            document.getElementById('alert-blockchain').classList.remove('d-none');
            document.getElementById('btn-blockchain').disabled = true;

            // Sembunyikan progress bar dan tombol reset
            document.getElementById('progress-container').classList.add('d-none');
            document.getElementById('btn-reset').classList.add('d-none');

            // Bersihkan log
            document.getElementById('log-enkripsi').innerHTML = "Sistem siap, log dibersihkan...<br>";
            document.getElementById('log-blockchain').innerHTML = "Menunggu data hash...<br>";
        });

        window.onload = muatRiwayat;
    </script>
</body>

</html>
